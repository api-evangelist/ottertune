name: OtterTune
description: 'OtterTune was a database optimization ("on autopilot") start-up spun out of
  Carnegie Mellon University''s database research group, operating from roughly 2020 to 2024.
  It applied machine learning to automatically tune the configuration knobs of PostgreSQL and
  MySQL databases (including managed instances such as Amazon RDS and Aurora) to improve
  performance and reduce cost. The company shut down in 2024 and its homepage now states the
  company is defunct. Its public GitHub organization remains available with infrastructure
  and agent tooling (ot-agent, Helm chart, CloudFormation/Terraform templates). This API
  Evangelist profile was added as a portfolio-company lead of Accel and captures the residual
  public footprint of a now-inactive company rather than a live API surface.'
